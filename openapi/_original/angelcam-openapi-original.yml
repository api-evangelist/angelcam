    ArrowServiceObject:
      type: object
      title: Arrow service
      properties:
        id:
          type: string
          description: Arrow service ID
        type:
          type: string
          enum:
            - http
            - rtsp
          description: Type of the service.
        mac:
          type: string
          format: mac
          description: |
            MAC address of the device providing this service. The MAC address will be valid only for services discovered via the network scan. In all other cases, it will be a fake MAC address starting with `FF:FF` prefix.
        ip:
          type: string
          description: |
            IP address used by the corresponding Arrow client to connect to the service (i.e. local IP address of the service).
        port:
          type: integer
          description: |
            Port number used by the corresponding Arrow client to connect to the service (i.e. the port which the service is listening on).
        flags:
          type: object
          description: Service flags.
          properties:
            static:
              type: boolean
              description: 'If `true`, the service is fixed and cannot be deleted.'
            discovered:
              type: boolean
              description: 'If `true`, the service was discovered by the network scanner.'
            custom:
              type: boolean
              description: 'If `true`, the service was added manually using the API.'
          required:
            - static
            - discovered
            - custom
        hints:
          type: object
          description: |
            Various hints that may help with service identification. Please note that the hints are best-effort only. They may not be always correct.
          properties:
            camera:
              type: boolean
              description: |
                If `true`, the service appears to be an RTSP server of an IP camera or an HTTP server of an IP camera providing an MJPEG stream.
            locked:
              type: boolean
              description: |
                The field is present only if the `camera` field is `true` and it indicates that the service may require authentication.
            stream:
              type: string
              nullable: true
              description: |
                The field is present only if the `camera` field is `true` and it indicates that there is likely a video stream on the given endpoint.
          required:
            - camera
        camera_ids:
          type: array
          items:
            type: integer
          description: A list of cameras (their IDs) which use this service.
      required:
        - id
        - type
        - mac
        - ip
        - port
        - camera_ids
      example:
        id: 21af
        type: rtsp
        mac: 'ff:ff:7f:00:00:01'
        ip: 127.0.0.1
        port: 554
        hints:
          camera: true
          locked: true
          stream: null
        flags:
          static: false
          discovered: true
          custom: false
        camera_ids: []
