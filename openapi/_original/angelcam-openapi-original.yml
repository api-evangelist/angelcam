    streamExpiresAt:
      name: stream_expires_at
      in: query
      required: false
      description: |
        Date and time when the returned camera streams should stop. By default, the returned streams have no expiration allowing the consumer to pull them indefinitely.
            
        Do not confuse this with expiration of the stream URLs themselves. The stream URLs have a short expiration in order to minimize the risk of leaking and this behavior cannot be changed. However, once a stream URL is used to establish a connection, the returned stream can be pulled indefinitely unless the `stream_expires_at` parameter is used.
      example: 2999-12-12T00%3A00%3A00Z
      schema:
        type: string
        format: date-time
