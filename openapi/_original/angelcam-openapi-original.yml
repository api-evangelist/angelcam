openapi: 3.0.0
info:
  version: 2026.06.11
  title: Angelcam API
  contact:
    email: support@angelcam.com
  x-logo:
    url: ./assets/logo-angelcam.svg
  description: |
    Angelcam RESTful API — HTTPS only, JSON, all URLs require a trailing slash. See the [developer docs](/) for quickstart, authentication, and key concepts.
tags:
  - name: space
    x-displayName: Spaces
    description: |
      A **space** is the organisational unit in Angelcam — it owns all resources: cameras, locations, recordings, services, and billing. Every API request operates within a space context — by default the user's default space, or a specific space selected via the `X-Space-Id` header.
      See the [Key concepts guide](/guides/key-concepts/) for details on space context and permissions.
  - name: user
    x-displayName: User
  - name: camera
    x-displayName: My cameras
    description: |
      Manage your cameras and access live streams, snapshots, and recordings. Supported codecs: H.264, H.265 (experimental), MJPEG. Live streams are limited to 10 concurrent consumers per camera — use the [broadcasting service](#tag/broadcasting) for higher concurrency.
  - name: shared-camera
    x-displayName: Shared cameras
    description: |
      For access to cameras which somebody shared with you. In general everything is same as in my cameras section, see above, there is only one difference. Together with cameras information you get also a camera's public page url
  - name: camera-guest
    x-displayName: Manage camera guests
    description: |
      You can share your camera with a guest, this means, you allow guests to view stream from your camera. There is also an option to share also recordings together with live stream.

      When you adding new guest, you just need their email. Then we send them an email informing them that you share camera with them. In case when there was no account with given email we precreate an account for these guest.
  - name: recording
    x-displayName: My cameras recording
    description: |
      Cloud Recording endpoints. Requires the Cloud Recording service to be active on the camera — otherwise all endpoints return 404.
      A camera can have multiple simultaneous recordings (e.g. continuous + event-only) with different retentions. The timeline endpoint returns _segments_ (continuous blocks of recorded video) for a given time range; maximum range per request is 24 hours.
  - name: stream-controls
    x-displayName: Recording stream controls
    description: |
      You normally don't have to know the `streamer_domain` and `stream_id` path parameter, but use the generated endpoint URLs as reported by the `stream_controls` field in a create-stream response. Those URLs correspond to the following endpoints.
      * base_url: [Recording stream info](#tag/stream-controls/operation/recordings-stream-info)
      * play: [Play stream](#tag/stream-controls/operation/recordings-stream-play)
      * pause: [Pause stream](#tag/stream-controls/operation/recordings-stream-pause)
      * speed: [Set plyback stream](#tag/stream-controls/operation/recordings-stream-speed)


      ## Syncing stream and timeline
      Due to various reasons, the time a user spends watching a stream doesn't necessarily have to match the time actually
      elapsed in the recorded video (i.e. a 5-minute long stream takes 6 minutes to watch on a user's slow mobile network
      connection due to lag).

      Periodically calling endpoint, [recordings stream info](#tag/stream-controls/operation/recordings-stream-info) comes in handy in this case, because it
      synchronizes the time shown to the user in your UI, with the current time of the stream. This endpoint tells you the
      exact time where the stream is positioned at the current moment.
  - name: shared-camera-recording
    x-displayName: Shared cameras recording
    description: |
      Everything is same as in recording for my own cameras. Just replace `cameras` by `shared-cameras` in every endpoints url.
  - name: clip
    x-displayName: My recording clips
    description: |
      A clip is a permanent, downloadable excerpt of recorded footage. Unlike a recording stream — which is a temporary playback session — a clip is processed into a file that can be downloaded or shared with others.
      **Prerequisite:** The camera must have the Cloud Recording service active. If not, recording endpoints return 404.

      ## Creating a clip
      1. **Check available footage.** Use [`recording/{recording_id}/timeline/`](#operation/my-cameras-recording-timeline) to confirm that footage exists for the time range you want.
      2. **Submit the clip request** via [`POST cameras/{camera_id}/clips/`](#operation/my-cameras-clips-create) with a `name`, `start`, and `end`. The maximum clip length is **3 hours**.
      3. **Poll for completion.** Clip processing is asynchronous. Status progresses from `PENDING` → `BUILDING` → `READY` (or `ERROR`). Poll [`cameras/{camera_id}/clips/{clip_id}/`](#operation/my-cameras-clips-detail) until the status is `READY`.
      4. **Download or share.** A `READY` clip includes a `download_url` (a time-limited direct download link) and a `sharing_token` for unauthenticated sharing via the clip share endpoint.
  - name: shared-camera-clip
    x-displayName: Shared recording clips
    description: |
      Recording clips on cameras shared with you. Everything works the same as [My recording clips](#tag/clip) — just replace `cameras` with `shared-cameras` in the endpoint URLs.
  - name: event
    x-displayName: Events
    description: |
      Events represent detections reported by cameras or sensors — typically motion detected by a camera or a trigger from an external sensor. Events are the building blocks for [RTS incidents](#tag/incidents) and camera timeline markers.

      ## Sending events to Angelcam
      When a camera or sensor detects something, it reports it to Angelcam by calling the event endpoint with its unique `hash` (found in the Angelcam dashboard or via the [Sensor](#tag/sensor) endpoints). Use `POST /v1/events/` in all cases where possible. A `GET /v1/events/` alternative exists solely for devices that are technically incapable of making POST requests (some older cameras). The rate limit for event submission is 10 requests per minute per hash.

      ## Listing events
      Pagination for event list endpoints works differently from other list endpoints: there is no `offset` parameter. Instead:
      - Use the `next` link in the response to move to the next page. - Pagination is one-directional (forward only). - Use the `start` and `end` filters to narrow down the time range.
      Events are returned ordered by `occurred_at` (newest first).
  - name: sensor
    x-displayName: My sensors
    description: |
      With sensor endpoints you can view, manage and connect sensors to the user account.

      Sensor can be bind to one particular already connected [camera](#tag/camera) to mark received [events](#tag/event) on camera timeline. If camera that sensor is bind to has active [Cloud Recording](#tag/recording) event recording can be enabled using these endpoints. Event recording will not be applied in the case that the camera assigned to the sensor doesn't have Cloud Recording activated.

      To specify event recording length [duration](#section/Angelcam-API/Time-and-duration-formats) format must be used and currently options for recording length are limited to:
        - 30 seconds
        - 1 minute
        - 2 minutes
        - 5 minutes

      Each sensor is given a unique email and unique hash. Those can be used to send [events](#tag/event) to Angelcam.
  - name: client
    x-displayName: Clients
    description: |
      Endpoints for reseller users to manage their clients.
      A reseller can create two types of client accounts:
      * **Full account** — the client has full control over their cameras and services. * **Limited account** — the client has read-only access. They can view their cameras and streams but cannot make any changes. A client can upgrade from limited to full at any time, which also revokes the reseller's access to their space.
      A reseller automatically has access to their clients' spaces (cameras, recordings, streams). A client — whether full or limited — can revoke this access at any time.
  - name: camera-stream-detection
    x-displayName: Camera streams detection
    description: Using these endpoints you can verify if there are camera streams available on specified network address. Detection is asynchronous. For this reason there is one endpoint for initializing stream detection and one for retrieving result of detection.
  - name: arrow-clients
    x-displayName: Arrow clients
    description: |
      Manage [Arrow clients](https://github.com/angelcam/arrow-client) — pair them with your account, inspect exposed services, and send commands.
      **Pairing:** restart the device (pairing mode is active for the first 20 minutes after start), POST to `arrow-clients/` to get the UUID, then poll `arrow-clients/{uuid}/` until status is `online`.
      **Arrow proxy:** use the transparent HTTP proxy or HTTP CONNECT proxy to reach services behind an Arrow client. Both require a `Host: {SERVICE_ID}-{ARROW_UUID}` header and a `Proxy-Authorization: Bearer` token from the Arrow client detail endpoint.
  - name: angelcameras
    x-displayName: AngelCameras
    description: ''
  - name: broadcasting
    x-displayName: My cameras broadcasting
    description: |
      Endpoints for managing broadcasting settings and retrieving broadcasting streams. If a camera doesn't have the Broadcasting service activated, all camera broadcasting endpoints will return HTTP 404.

      The broadcasting service can be used whenever you need more concurrent stream consumers. It does not necessarily mean that the stream from your camera has to be public.
  - name: public-camera
    x-displayName: Public cameras
    description: |
      Endpoints for browsing cameras that are publicly accessible. A camera appears here if it has the Broadcasting service active and has been marked as public — either because it uses free public broadcasting, or because the camera owner has explicitly enabled public access.
      > **Access restricted:** These endpoints are available only to partners who have arranged access with Angelcam. Please contact [support](https://www.angelcam.com/support/) if you are interested in using them.
  - name: service
    x-displayName: Available services
    description: |
      A catalog of services available for purchase. Use these endpoints to discover service `code` values before activating a service via the [My services](#tag/active-service) endpoints.
      Services fall into two categories:
      * **Account plan** — your overall subscription level. * **Camera services** — features you enable on individual cameras. The two main camera services are **Cloud Recording** and **Broadcasting**. Activating a camera service creates an active service instance that you then [assign to a specific camera](#operation/my-service-usage-update).
  - name: active-service
    x-displayName: My services
    description: |
      Endpoints for managing your activated services and assigning them to cameras.
      A service must first be activated (purchased) for your account, then assigned to a specific camera before it takes effect on that camera.

      ## Service lifecycle
      1. **Find a service code.** Browse [available services](#operation/services) to get the `code` of the service you want.
      2. **Activate the service** by calling [`POST /billing/active-services/`](#operation/activate-service). Provide the service `code` and a billing `period` — `P1M` for monthly or `P1Y` for annual billing.
      3. **Assign to a camera** by calling [`PUT /billing/active-services/{id}/usage/`](#operation/my-service-usage-update) with the `camera_id`. Set `camera_id` to `null` to unassign.
      4. **Upgrade or downgrade** at any time via [`PUT /billing/active-services/{id}/`](#operation/my-service-update). A downgrade takes effect at the end of the current billing period by default. Set `force_downgrade: true` to apply it immediately with prorated credit.
      5. **Cancel** via [`DELETE /billing/active-services/{id}/`](#operation/my-service-cancel).
  - name: order
    x-displayName: My Orders
  - name: incidents
    x-displayName: Incidents
    description: |
      Endpoints for managing Real Time Security (RTS) incidents.
      An incident is a security event that has been detected and may require attention. Incidents are created automatically when sensor events or camera status changes match an active [notification rule](#tag/rts_notification_rules).
      Incidents go through the following states:
      * **Open** — the incident has been created and not yet reviewed. * **Verified** — acknowledged as a genuine security event (`verified_at` is set). * **Closed** — the incident has been resolved (`closed_at` is set). An incident can be closed without being verified first (e.g. a false alarm).
  - name: rts_messages
    x-displayName: Messages
    description: |
      Endpoints for managing notifications. Base object is message. We create a message when something important happens. For example, when a camera goes offline, when a sensor detects motion, etc. When a message is created, we can send it to user using different notification methods based on notification rules.
  - name: rts_notification_methods
    x-displayName: Notification methods
    description: |
      Manage notification methods — email and HTTP webhook. HTTP methods send a signed POST to your URL with a JSON payload on each notification. See the [Webhooks guide](/guides/webhooks/) for payload fields and signature verification.
  - name: rts_notification_rules
    x-displayName: Notification rules
    description: |
      Endpoints for managing notification rules. Notification rule is a rule that defines when and how we should send message to user. For example, we can create rule that says: "When camera goes offline, send me an email".
  - name: rts_settings
    x-displayName: Settings
    description: |
      Global Real Time Security (RTS) settings for your account.
      The main setting is `incident_ttl`, which controls how long (in [ISO 8601 duration format](#section/Angelcam-API/Time-and-duration-formats)) an open incident stays active before it is automatically closed when no new events are received.
  - name: location
    x-displayName: Locations
    description: |
      Endpoints for accessing and managing locations. Locations are used to organize cameras into groups. Every camera belongs to exactly one location, and every user has a root location whose ID is available from the [Current User Info](#tag/user) endpoint.
      Locations can be **armed** or **disarmed**. When a location is armed, Real Time Security (RTS) will generate notifications for events on cameras in that location. Each location supports scheduled arming/disarming so notifications can be active only during certain hours.
      > **Note:** Creating, editing, and deleting locations is currently only possible through the [My Angelcam](https://my.angelcam.com/) web UI. These API endpoints provide read access only.
  - name: speakers
    x-displayName: Speakers
    description: |
      Manage speakers and trigger audio playback. See the [Speakers guide](/guides/speakers/) for setup instructions, including how to configure an AngelBox as a speaker.
  - name: audio-message
    x-displayName: Audio messages
    description: |
      Endpoints for managing audio messages. Audio messages are pre-recorded audio clips that can be played through [speakers](#tag/speakers).
      Audio files are uploaded as Base64-encoded content. Supported formats: AAC (`audio/aac`), MP3 (`audio/mpeg`), WAV (`audio/wav`), OGG (`audio/ogg`), and WebM audio (`audio/webm`).
      Keep audio files short — a few seconds is ideal. Large files will increase upload time and may affect playback reliability.
x-tagGroups:
  - name: General
    tags:
      - user
      - space
      - location
  - name: Camera management
    tags:
      - camera
      - shared-camera
      - camera-guest
      - camera-stream-detection
      - arrow-clients
      - angelcameras
  - name: Recording
    tags:
      - recording
      - stream-controls
      - shared-camera-recording
      - clip
      - shared-camera-clip
  - name: Broadcasting
    tags:
      - broadcasting
      - public-camera
  - name: Events & Sensors
    tags:
      - event
      - sensor
  - name: Speaker management
    tags:
      - speakers
      - audio-message
  - name: RTS
    tags:
      - incidents
      - rts_settings
      - rts_messages
      - rts_notification_methods
      - rts_notification_rules
  - name: Billing
    tags:
      - service
      - active-service
      - order
  - name: Clients
    tags:
      - client
servers:
  - url: 'https://api.angelcam.com/v1'
paths:
  '/angelcamera/latest-firmware/{board}/':
    get:
      operationId: angelcamera-latest-firmware-get
      summary: Get AngelCamera firmware
      description: Get the latest firmware for a given AngelCamera model.
      tags:
        - angelcameras
      security:
        - OAuth2: []
        - PersonalAccessToken: []
      parameters:
        - name: board
          in: path
          required: true
          description: AngelCamera board ID
          example: c3c9429e42c76e50f0f300267a7ac733
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AngelCameraFirmwareResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '404':
          $ref: '#/components/responses/Error404NotFound'
  /arrow-clients/:
    get:
      operationId: arrow-clients-list
      summary: List paired Arrow clients
      description: Get a list of Arrow clients paired with the current user account.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_access
        - PersonalAccessToken: []
      parameters:
        - name: mac
          in: query
          required: false
          description: |
            If set, the endpoint will return only Arrow clients with a given MAC address. You can use either the colon or the dash separated format or you can omit the separator completely.
          example: 11-22-33-aa-bb-cc
          schema:
            type: string
            format: mac
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientsResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
    post:
      operationId: arrow-client-pairing-request
      summary: Request pairing of an Arrow client
      description: |
        Request pairing of a given Arrow client with the current user account. One of the `uuid`, `angelbox_id` or `mac` parameter is required. In case the Arrow client has been paired already, the API will check if the current user can access the client. If the user can access the client, the API will respond with UUID of the client (i.e. the standard response). Otherwise, the API will respond with "Permission Denied".

        Pairing via MAC address is only available upon request, otherwise API responds with "Permission Denied". When using MAC there will be MAC adress in the response instead of UUID.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid:
                  type: string
                  format: uuid
                  description: UUID of the paired Arrow client
                angelbox_id:
                  type: string
                  description: AngelBox ID
                mac:
                  type: string
                  format: MAC address
                  description: MAC address of the Arrow client
              example:
                uuid: 75b62326-eca3-4424-ab68-48e7da47e847
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientPairingResponse'
        '400':
          $ref: '#/components/responses/Error400InvalidBody'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
  '/arrow-clients/{mac}/':
    get:
      operationId: arrow-client-detail-mac
      summary: Arrow client detail (MAC address pairing)
      description: 'Get detailed information about a given Arrow client, it can be used **just during the paring process via MAC address**. When you know uuid of the client, use [Arrow client detail API endpoint](#operation/arrow-client-detail) endpoint instead.'
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_access
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientMAC'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientDetailObject'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
  '/arrow-clients/{uuid}/':
    get:
      operationId: arrow-client-detail
      summary: Arrow client detail
      description: Get detailed information about a given Arrow client.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_access
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientDetailObject'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
    delete:
      operationId: arrow-client-unpair
      summary: Unpair Arrow client
      tags:
        - arrow-clients
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
  '/arrow-clients/{uuid}/reset-service-table/':
    post:
      operationId: arrow-client-reset-service-table
      summary: Reset service table
      description: |
        Remove all automatically discovered and/or custom services from the client's service table.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  description: |
                    When `true`, all non-static services will be removed. Otherwise, only discovered services will be removed.
                  example: false
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '502':
          $ref: '#/components/responses/Error502BadGateway'
  '/arrow-clients/{uuid}/scan-network/':
    post:
      operationId: arrow-client-scan-network
      summary: Scan network
      description: |
        Trigger a scan of the local network that the Arrow client is connected to. The scan discovers cameras and other services available on that network.

        The scan runs asynchronously — this endpoint returns immediately. To check whether the scan is still in progress, poll the [Arrow client detail](#operation/arrow-client-detail) endpoint and inspect the `scanning` field. Discovered services appear in the [Arrow client services](#operation/arrow-client-services) list once the scan completes.

        The API responds with 502 Bad Gateway if the Arrow client is offline or unreachable.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '502':
          $ref: '#/components/responses/Error502BadGateway'
  '/arrow-clients/{uuid}/services/':
    get:
      operationId: arrow-client-services
      summary: List Arrow services
      description: Get a list of services visible and available to a given Arrow client.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_access
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientServicesResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
    post:
      operationId: add-arrow-service
      summary: Add Arrow service
      description: |
        Add a custom service to the Arrow client service table.

        This method is supported only if the `add_custom_service` capability is
        signaled by the Arrow client. It can be used to access IP cameras in
        the target network if the automatic service discovery does not find
        them. The Arrow client will verify that the IP address belongs to the
        same local network it is connected to. Other IP addresses will be
        rejected for security reasons.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowClientAddServiceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowClientAddServiceResponse'
        '400':
          $ref: '#/components/responses/Error400InvalidBody'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '405':
          $ref: '#/components/responses/Error405MethodNotAllowed'
        '502':
          $ref: '#/components/responses/Error502BadGateway'
  '/arrow-clients/{uuid}/services/{service_id}/':
    get:
      operationId: arrow-client-service-detail
      summary: Retrieve Arrow service
      description: Get details about a service visible and available to a given Arrow client.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_access
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
        - $ref: '#/components/parameters/arrowClientServiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowServiceObject'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
    delete:
      operationId: arrow-client-service-delete
      summary: Delete Arrow service
      description: |
        Delete given Arrow service from the client's service table.

        Note that it is only possible to delete services that were added via the [corresponding API call](#tag/arrow-clients/operation/add-arrow-service). If the same service was also discovered by the network scanner, it will remain available as long as it is still visible for the network scanner.
      tags:
        - arrow-clients
      security:
        - OAuth2:
            - arrow_client_manage
        - PersonalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/arrowClientId'
        - $ref: '#/components/parameters/arrowClientServiceId'
      responses:
        '204':
          $ref: '#/components/responses/EmptyResponse'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '502':
          $ref: '#/components/responses/Error502BadGateway'
  /audio-messages/:
    get:
