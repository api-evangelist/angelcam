          - start: '2017-06-09T04:19:42.000Z'
            end: '2017-06-09T010:39:31Z'
    AccessAssignmentObject:
      type: object
      title: Access assignment
      description: |
        A single permission grant within a space. The scope of the permission is determined by which fields are set:
        - **Space-level** (`location_id` and `camera_id` are null): the permission applies across the entire space. - **Location-level** (`location_id` is set, `camera_id` is null): the permission applies to a specific location. Used for `location.*` slugs. - **Camera-level** (`location_id` and `camera_id` are both set): the permission applies to a specific camera. Used for `camera.*` slugs.
      required:
        - permission
      properties:
        permission:
          type: string
          description: Permission slug.
          example: camera.view
          enum:
            - space.admin
            - space.limited_client
            - space.billing
            - camera.notifications.status
            - location.notifications.incident
            - location.notifications.other
            - location.access
            - location.view
            - location.arming
            - location.manage
            - camera.view
            - camera.manage
            - camera.recording.view
            - camera.recording.manage
            - camera.clip.view
            - camera.clip.manage
            - camera.clip.create
            - camera.broadcasting.manage
            - camera.timelapse.manage
        location_id:
          type: integer
          nullable: true
          description: |
            When set, the permission is scoped to this location. Always present for `location.*` and `camera.*` slugs.
          example: 12
        camera_id:
          type: integer
          nullable: true
          description: |
            When set, the permission is scoped to this camera. Always present for `camera.*` slugs, together with `location_id`.
          example: null
      example:
        permission: camera.view
        location_id: 12
        camera_id: 345
