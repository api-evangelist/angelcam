  /cameras/:
    get:
      operationId: my-cameras-list
      summary: Retrieve camera list
      tags:
        - camera
      parameters:
        - name: limit
          in: query
          required: false
          description: 'Limit result set. Example: `1`.'
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: 'Return results starting at `offset`. Example: `10`.'
          schema:
            type: integer
            minimum: 1
        - name: refresh_rate
          in: query
          required: false
          description: 'Set a maximum number of frames per second sent in an MJPEG stream. For example, if you want to get an MJPEG stream with frame sent every 10 seconds, use value 0.1.'
          schema:
            type: number
            format: float
            minimum: 0
        - name: max_width
          in: query
          required: false
          description: Maximum frame width for the MJPEG stream and LIVE SNAPSHOT.
          schema:
            type: integer
            minimum: 1
        - name: max_height
          in: query
          required: false
          description: Maximum frame height for the MJPEG stream and LIVE SNAPSHOT.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/streamExpiresAt'
        - name: has_guests
          in: query
          required: false
          description: '1 for retrieving list of cameras that have been shared with someone, 0 for retrieving list of cameras that have not been shared with anyone. Leaving parameter empty will return list of all user cameras.'
          schema:
            type: boolean
        - name: tags
          in: query
          required: false
          description: 'Filter cameras by tags. Multiple tags can be specified by separating them with a comma. When using multiple tags, any camera that has at least one of the specified tags will be returned.'
          schema:
            type: string
          example: 'tag1,tag2'
        - name: ids
          in: query
          required: false
          description: Filter cameras by IDs. Multiple IDs can be specified by separating them with a comma.
          schema:
            type: string
          example: '1,2,3'
        - name: location_id
          in: query
          required: false
          description: Filter cameras by location ID. Only cameras belonging to the specified location will be returned.
          schema:
            type: integer
            minimum: 1
          example: 1
      security:
        - OAuth2:
            - camera_access
        - PersonalAccessToken: []
      responses:
        '200':
          description: Returns camera list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraListResponse'
        '400':
          $ref: '#/components/responses/Error400InvalidParams'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
    post:
      operationId: connect-cameras
      summary: Connect new camera
      tags:
        - camera
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - url
                - connection_type
              properties:
                name:
                  type: string
                  description: Camera name
                type:
                  type: string
                  enum:
                    - h264
                    - h265
                    - mjpeg
                  description: Camera type. We currently support H.264/H.265 over RTSP and MJPEG over HTTP cameras.
                connection_type:
                  type: string
                  enum:
                    - direct
                    - arrow
                  description: |
                    How is the camera connected to Angelcam. The `direct` connection means that the camera stream is available on a public IP address. The `arrow` option can be used for connecting cameras that can be accessed via an Arrow client. Please note that cameras connected via an Arrow client use URL in a specific format. You will need to use the [stream detection](#tag/camera-stream-detection) endpoints to obtain the URL first.
                url:
                  type: string
                  format: url
                  description: |
                    Complete URL of a camera stream. H.264 and H.265 cameras must use "rtsp" scheme, for MJPEG cameras it's allowed to use "http" and "https" schemes. The "https" scheme is valid only for cameras using the `direct` connection type.
                enable_status_checks:
                  type: boolean
                  default: true
                  description: Enable periodic online/offline checks for the camera.
                enable_periodical_snapshots:
                  type: boolean
                  default: true
                  description: Refresh camera snapshot automatically once every 24h.
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tags assigned to the camera. Tags can be used for filtering.
              example:
                name: My brand new shiny camera
                type: h264
                connection_type: direct
                url: 'rtsp://username:password@175.36.248.73:554/live.sdp'
      security:
        - OAuth2:
            - camera_create
        - PersonalAccessToken: []
      responses:
        '201':
          description: Newly created camera object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraObject'
        '400':
          $ref: '#/components/responses/Error400InvalidBody'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
  /cameras/stream-detection/:
    post:
      operationId: stream-detection-start
      summary: Start stream detection
      description: |
        Retrieve `session_id` which can be used for [querying stream detection result](#operation/stream-detection-result).
      tags:
        - camera-stream-detection
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: |
                    Various address types can be used. Valid examples: `my-camera.my-site.com/feed`, `http://test:test@my-camera.my-site.com:80/feed?show=1`, `rtsp://site.domain.com/camera1`, `132.45.32.21`. As you can see from examples `address` can optionally contain information about `port`, `username` and `password`. In such cases these fields can be omitted from request body. The `arrow_service` field must not be present if the `address` field is being used.
                arrow_service:
                  type: object
                  properties:
                    arrow_client:
                      type: string
                      format: uuid
                      description: Arrow client UUID
                    service_id:
                      type: string
                      description: Arrow service ID
                  description: |
                    Use this field for stream detection via an Arrow client. The `path` field can be used to request detection on a specific endpoint in addition to all endpoints tested by the stream detector service. The `address` field must not be present if the `arrow_service` field is being used.
                path:
                  type: string
                  description: Stream path (if not given in the address field).
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: If port is not specified all reasonable ports will be tested.
                username:
                  type: string
                password:
                  type: string
              example:
                address: 'http://test:test@my-camera.my-site.com:80/feed?show=1'
      security:
        - OAuth2:
            - streams_detect
        - PersonalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraStartStreamDetectionResponse'
        '400':
          $ref: '#/components/responses/Error400InvalidParams'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
