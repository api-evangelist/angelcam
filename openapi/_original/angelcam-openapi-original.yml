        '404':
          $ref: '#/components/responses/Error404NotFound'
components:
  schemas:
    ActiveServiceListResponse:
      type: object
      title: Active service list
      properties:
        count:
          type: integer
          description: Count of all services
        next:
          format: uri
          description: Next page from pagination
          nullable: true
          type: string
        previous:
          format: uri
          description: Previous page from pagination
          nullable: true
          type: string
        results:
          type: array
          description: List of services available for user
          items:
            $ref: '#/components/schemas/ActiveServiceObject'
      required:
        - count
        - next
        - previous
        - results
    ActiveServiceObject:
      type: object
      title: Service object
      properties:
        id:
          type: integer
        current_service:
          $ref: '#/components/schemas/ServiceObject'
          description: Current service
          nullable: true
        renew_service:
          $ref: '#/components/schemas/ServiceObject'
          description: Pending service (the service that will be activated at the next renewal)
          nullable: true
        renew_period:
          type: string
          format: duration
          example: P1M
          nullable: true
        valid_until:
          type: string
          format: datetime
        in_use:
          type: boolean
          description: Says if service is in use for example by a camera
        usage_detail:
          $ref: '#/components/schemas/UsageDetailObject'
      required:
        - id
        - current_service
        - renew_service
        - renew_period
        - valid_until
        - in_use
        - usage_detail
    ActiveServiceUsageObject:
      type: object
      title: Service object
      properties:
        id:
          type: integer
        in_use:
          type: boolean
          description: Says if service is in use for example by a camera
        usage_detail:
          $ref: '#/components/schemas/UsageDetailObject'
          nullable: true
      required:
        - id
        - in_use
        - usage_detail
    AngelCameraFirmwareResponse:
      type: object
      title: AngelCamera firmware
      properties:
        board:
          type: string
          description: AngelCamera board ID
        model:
          type: string
          description: AngelCamera model name
        version:
          type: string
          description: Firmware version
        image:
          type: string
          format: url
          description: Firmware image URL
        changelog:
          type: string
          description: Changelog
      required:
        - board
        - model
        - version
        - image
        - changelog
      example:
        board: c3c9429e42c76e50f0f300267a7ac733
        model: AngelCamera One
        version: 1.20.0
        image: 'https://download.angelcam.com/angelcamera/c3c9429e42c76e50f0f300267a7ac733/fw-1.20.0.img'
        changelog: ''
    ApplicationObject:
      type: object
      properties:
        code:
          type: string
          enum:
            - LSA
            - CRA
            - VVA
            - VPA
            - TLA
      required:
        - code
      example:
        code: LSA
    ArrowClientAddServiceRequest:
      type: object
      title: New Arrow service
      properties:
        type:
          type: string
          enum:
            - http
            - rtsp
          description: Type of the target service
        ip:
          type: string
          description: local IP address
        port:
          type: integer
          description: service port
      required:
        - type
        - ip
        - port
      example:
        type: rtsp
        ip: 192.168.1.100
        port: 554
    ArrowClientAddServiceResponse:
      type: object
      title: Arrow client add service response
      properties:
        service_id:
          type: string
          description: Arrow service ID
      required:
        - service_id
      example:
        service_id: abcd
    ArrowClientDetailObject:
      type: object
      title: Arrow client
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the Arrow client
          nullable: true
        mac:
          type: string
          format: mac
          description: MAC address of the device running the Arrow client
          nullable: true
        ip:
          type: string
          description: Public IP address of the device running the Arrow client
        status:
          type: string
          enum:
            - online
            - offline
            - not_paired
          description: |
            Current availability of the Arrow client. The `not_paired` value means that there is an active pairing request for this client, however, the client has not reached Angelcam servers yet.
        scanning:
          type: boolean
          description: |
            True if the client is currently scanning the target network, false otherwise
        proxy:
          type: object
          description: |
            Arrow proxy addresses and credentials (see
            [the description](#tag/arrow-clients/Arrow-proxy) for more details)
          properties:
            connect:
              type: object
              description: HTTP CONNECT proxy addresses
              properties:
                http:
                  type: string
                  description: HTTP address of the Arrow proxy
                https:
                  type: string
                  description: HTTPS address of the Arrow proxy
            transparent:
              type: object
              description: Transparent HTTP proxy addresses
              properties:
                http:
                  type: string
                  description: HTTP address of the Arrow proxy
                https:
                  type: string
                  description: HTTPS address of the Arrow proxy
            token:
              type: string
              description: Arrow proxy access token
        capabilities:
          type: object
          description: Features supported by the Arrow client
          properties:
            add_custom_service:
              type: boolean
              description: True if adding custom services via API is supported.
      required:
        - uuid
        - mac
        - status
      example:
        uuid: 75b62326-eca3-4424-ab68-48e7da47e847
        mac: '12:34:56:78:9a:bc'
        ip: 1.1.1.1
        status: online
        scanning: true
        proxy:
          connect:
            http: 'm1-eu1.angelcam.com:8920'
            https: 'm1-eu1.angelcam.com:8940'
          transparent:
            http: 'm1-eu1.angelcam.com:8921'
            https: 'm1-eu1.angelcam.com:8941'
          token: xxx.yyy.zzz
        capabilities:
          add_custom_service: true
