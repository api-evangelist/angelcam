    post:
      operationId: my-cameras-clips-create
      summary: Create clip
      tags:
        - clip
      description: |
        Request creation of a recording clip for the given camera. Clip processing is **asynchronous** — the response will have status `PENDING`. Poll `cameras/{camera_id}/clips/{clip_id}/` until status reaches `READY` or `ERROR`. The maximum clip length is 3 hours.
      parameters:
        - $ref: '#/components/parameters/cameraId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: clip
              required:
                - name
                - start
                - end
              properties:
                name:
                  type: string
                  description: Clip name
                start:
                  type: string
                  format: date-time
                  description: Start time of clip (ISO 8601)
                end:
                  type: string
                  format: date-time
                  description: End time of clip (ISO 8601)
                recording:
                  type: string
                  format: uuid
                  description: 'Optional recording_id; if not specified, continuous recording will be used'
              example:
                name: Frontdoor loitering
                start: '2017-01-01T00:00:00.000Z'
                end: '2017-01-01T00:25:00.000Z'
      security:
        - OAuth2:
            - recording_clips_access
            - recording_clips_create
        - PersonalAccessToken: []
      responses:
        '201':
          description: Clip request was received and clip processing will start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipObject'
        '400':
          description: 'The request is invalid. Common reasons: no recording footage exists for the requested time range, or the requested clip length exceeds the 3 hour maximum.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Invalid'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
