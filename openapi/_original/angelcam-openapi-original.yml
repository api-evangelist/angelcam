    get:
      operationId: my-service-detail
      summary: Retrieve my service detail
      tags:
        - active-service
      parameters:
        - $ref: '#/components/parameters/activeServiceId'
      security:
        - OAuth2:
            - active_services_access
        - PersonalAccessToken: []
      responses:
        '200':
          description: Returns detail of my active service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveServiceObject'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
        '404':
          $ref: '#/components/responses/Error404NotFound'
    put:
      operationId: my-service-update
      summary: Change service
      tags:
        - active-service
      parameters:
        - $ref: '#/components/parameters/activeServiceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - period
              properties:
                code:
                  type: string
                  description: 'Code of service, this code together with type is unique identifier of service'
                  example: 3-days
                period:
                  type: string
                  format: duration
                  enum:
                    - P1M
                    - P1Y
                force_downgrade:
                  type: boolean
                  default: false
                  description: |
                    If set to false, the downgrade occurs after the current period concludes. If set to true, the downgrade happens immediately, applying the prorated price of the current service towards the new service. Should the prorated price exceed the cost of the new service, the new service will be extended for a period that matches the full price value.
              example:
                code: 3days
                period: P1M
      security:
        - OAuth2:
            - active_services_manage
        - PersonalAccessToken: []
      responses:
        '201':
          description: Newly activated service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveServiceObject'
        '400':
          $ref: '#/components/responses/Error400InvalidBody'
        '401':
          $ref: '#/components/responses/Error401Unauthorized'
        '403':
          $ref: '#/components/responses/Error403PermissionDenied'
