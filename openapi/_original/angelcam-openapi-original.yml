                  type: string
                  description: 'Code of service, this code together with type is unique identifier of service'
                  example: 3-days
                period:
                  type: string
                  format: duration
                  description: 'Billing period — `P1M` for monthly, `P1Y` for annual.'
                  enum:
                    - P1M
                    - P1Y
              example:
                code: 3-days
                period: P1M
