apis:
- aid: angelcam:angelcam-active-service-api
  name: AngelCam active-service API
  description: >-
    Endpoints for managing your activated services and assigning them to cameras.

    A service must first be activated (purchased) for your account, then assigned to a specific camera
    before it takes effect on that camera.


    ## Service lifecycle

    1. **Find a service code.** Browse [available services](#operation/services) to get the `code` of
    the service you want.

    2. **Activate the service** by calling [`POST /billing/active-services/`](#operation/activate-service).
    Provide the service `code` and a billing `period` — `P1M` for monthly or `P1Y` for annual billing.

    3. **Assign to a camera** by calling [`PUT /billing/active-services/{id}/usage/`](#operation/my-service-usage-update)
    with the `camera_id`. Set `camera_id` to `null` to unassign.

    4. **Upgrade or downgrade** at any time via [`PUT /billing/active-services/{id}/`](#operation/my-service-update).
    A downgrade takes effect at the end of the current billing period by default. Set `force_downgrade:
    true` to apply it immediately with prorated credit.

    5. **Cancel** via [`DELETE /billing/active-services/{id}/`](#operation/my-service-cancel).
