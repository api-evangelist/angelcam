- aid: angelcam:angelcam-location-api
  name: AngelCam location API
  description: >-
    Endpoints for accessing and managing locations. Locations are used to organize cameras into groups.
    Every camera belongs to exactly one location, and every user has a root location whose ID is available
    from the [Current User Info](#tag/user) endpoint.

    Locations can be **armed** or **disarmed**. When a location is armed, Real Time Security (RTS) will
    generate notifications for events on cameras in that location. Each location supports scheduled arming/disarming
    so notifications can be active only during certain hours.

    > **Note:** Creating, editing, and deleting locations is currently only possible through the [My Angelcam](https://my.angelcam.com/)
    web UI. These API endpoints provide read access only.
