  description: >-
    Endpoints for managing audio messages. Audio messages are pre-recorded audio clips that can be played
    through [speakers](#tag/speakers).

    Audio files are uploaded as Base64-encoded content. Supported formats: AAC (`audio/aac`), MP3 (`audio/mpeg`),
    WAV (`audio/wav`), OGG (`audio/ogg`), and WebM audio (`audio/webm`).

    Keep audio files short — a few seconds is ideal. Large files will increase upload time and may affect
    playback reliability.
