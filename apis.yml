aid: angelcam
name: AngelCam
description: Angelcam is a cloud video-surveillance platform that connects any IP camera to the cloud
  — via ONVIF and the open-source Arrow connector — for live viewing, cloud recording, clip creation
  and sharing, two-way audio, sensors, and Remote Technical Surveillance (RTS) event notifications.
  The Angelcam RESTful API (HTTPS-only JSON, organised around Spaces, secured with OAuth2 or a
  Personal Access Token) exposes 90+ endpoints across cameras, recordings, clips, events, Arrow
  clients, notifications, speakers, and services.
