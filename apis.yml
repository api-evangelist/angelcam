- aid: angelcam:angelcam-clip-api
  name: AngelCam clip API
  description: >-
    A clip is a permanent, downloadable excerpt of recorded footage. Unlike a recording stream — which
    is a temporary playback session — a clip is processed into a file that can be downloaded or shared
    with others.

    **Prerequisite:** The camera must have the Cloud Recording service active. If not, recording endpoints
    return 404.


    ## Creating a clip

    1. **Check available footage.** Use [`recording/{recording_id}/timeline/`](#operation/my-cameras-recording-timeline)
    to confirm that footage exists for the time range you want.

    2. **Submit the clip request** via [`POST cameras/{camera_id}/clips/`](#operation/my-cameras-clips-create)
    with a `name`, `start`, and `end`. The maximum clip length is **3 hours**.

    3. **Poll for completion.** Clip processing is asynchronous. Status progresses from `PENDING` → `BUILDING`
    → `READY` (or `ERROR`). Poll [`cameras/{camera_id}/clips/{clip_id}/`](#operation/my-cameras-clips-detail)
    until the status is `READY`.

    4. **Download or share.** A `READY` clip includes a `download_url` (a time-limited direct download
    link) and a `sharing_token` for unauthenticated sharing via the clip share endpoint.
  humanURL: https://developers.angelcam.com/
  baseURL: https://api.angelcam.com/v1
