- aid: angelcam:angelcam-stream-controls-api
  name: AngelCam stream-controls API
  description: >-
    You normally don't have to know the `streamer_domain` and `stream_id` path parameter, but use the
    generated endpoint URLs as reported by the `stream_controls` field in a create-stream response. Those
    URLs correspond to the following endpoints.

    * base_url: [Recording stream info](#tag/stream-controls/operation/recordings-stream-info)

    * play: [Play stream](#tag/stream-controls/operation/recordings-stream-play)

    * pause: [Pause stream](#tag/stream-controls/operation/recordings-stream-pause)

    * speed: [Set plyback stream](#tag/stream-controls/operation/recordings-stream-speed)



    ## Syncing stream and timeline

    Due to various reasons, the time a user spends watching a stream doesn't necessarily have to match
    the time actually

    elapsed in the recorded video (i.e. a 5-minute long stream takes 6 minutes to watch on a user's slow
    mobile network

    connection due to lag).


    Periodically calling endpoint, [recordings stream info](#tag/stream-controls/operation/recordings-stream-info)
    comes in handy in this case, because it

    synchronizes the time shown to the user in your UI, with the current time of the stream. This endpoint
    tells you the

    exact time where the stream is positioned at the current moment.
  humanURL: https://developers.angelcam.com/
  baseURL: https://api.angelcam.com/v1
