- aid: angelcam:angelcam-event-api
  name: AngelCam event API
  description: >-
    Events represent detections reported by cameras or sensors — typically motion detected by a camera
    or a trigger from an external sensor. Events are the building blocks for [RTS incidents](#tag/incidents)
    and camera timeline markers.


    ## Sending events to Angelcam

    When a camera or sensor detects something, it reports it to Angelcam by calling the event endpoint
    with its unique `hash` (found in the Angelcam dashboard or via the [Sensor](#tag/sensor) endpoints).
    Use `POST /v1/events/` in all cases where possible. A `GET /v1/events/` alternative exists solely
    for devices that are technically incapable of making POST requests (some older cameras). The rate
    limit for event submission is 10 requests per minute per hash.


    ## Listing events

    Pagination for event list endpoints works differently from other list endpoints: there is no `offset`
    parameter. Instead:

    - Use the `next` link in the response to move to the next page. - Pagination is one-directional (forward
    only). - Use the `start` and `end` filters to narrow down the time range.

    Events are returned ordered by `occurred_at` (newest first).
  humanURL: https://developers.angelcam.com/
  baseURL: https://api.angelcam.com/v1
