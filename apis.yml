    With sensor endpoints you can view, manage and connect sensors to the user account.


    Sensor can be bind to one particular already connected [camera](#tag/camera) to mark received [events](#tag/event)
    on camera timeline. If camera that sensor is bind to has active [Cloud Recording](#tag/recording)
    event recording can be enabled using these endpoints. Event recording will not be applied in the case
    that the camera assigned to the sensor doesn't have Cloud Recording activated.


    To specify event recording length [duration](#section/Angelcam-API/Time-and-duration-formats) format
    must be used and currently options for recording length are limited to:
      - 30 seconds
      - 1 minute
      - 2 minutes
      - 5 minutes

    Each sensor is given a unique email and unique hash. Those can be used to send [events](#tag/event)
    to Angelcam.
