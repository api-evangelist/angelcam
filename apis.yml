- aid: angelcam:angelcam-arrow-clients-api
  name: AngelCam arrow-clients API
  description: >-
    Manage [Arrow clients](https://github.com/angelcam/arrow-client) — pair them with your account, inspect
    exposed services, and send commands.

    **Pairing:** restart the device (pairing mode is active for the first 20 minutes after start), POST
    to `arrow-clients/` to get the UUID, then poll `arrow-clients/{uuid}/` until status is `online`.

    **Arrow proxy:** use the transparent HTTP proxy or HTTP CONNECT proxy to reach services behind an
    Arrow client. Both require a `Host: {SERVICE_ID}-{ARROW_UUID}` header and a `Proxy-Authorization:
    Bearer` token from the Arrow client detail endpoint.
