- aid: angelcam:angelcam-incidents-api
  name: AngelCam incidents API
  description: >-
    Endpoints for managing Real Time Security (RTS) incidents.

    An incident is a security event that has been detected and may require attention. Incidents are created
    automatically when sensor events or camera status changes match an active [notification rule](#tag/rts_notification_rules).

    Incidents go through the following states:

    * **Open** — the incident has been created and not yet reviewed. * **Verified** — acknowledged as
    a genuine security event (`verified_at` is set). * **Closed** — the incident has been resolved (`closed_at`
    is set). An incident can be closed without being verified first (e.g. a false alarm).
  humanURL: https://developers.angelcam.com/
  baseURL: https://api.angelcam.com/v1
