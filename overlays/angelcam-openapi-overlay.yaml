overlay: 1.0.0
info:
  title: API Evangelist enhancements for Angelcam API
  version: 1.0.0
extends: openapi/angelcam-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-17'
    x-apievangelist-artifacts:
    - authentication
    - scopes
    - conventions
    - errors
    - lifecycle
    - rate-limits
    - data-model
    - conformance
    - agentic-access
    - mcp
    - skills
    - webhooks
    x-api-base-url: https://api.angelcam.com/v1
- target: $.info
  update:
    x-rate-limit:
      per_minute: 30
      per_hour: 1000
- target: $.info
  update:
    x-status-page: https://status.angelcam.com
